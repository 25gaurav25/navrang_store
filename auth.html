<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Navrang</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <nav class="top-navbar">
   <a href="index.html"class="nav-logo">NAVRANG</a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="cart.html">Shop</a></li> 
      <li><a href="about.html">About</a></li> 
      <li><a href="auth.html" id="auth-link"><span class="active">Sign up</span></a></li>
    </ul>
  </nav>

  <div class="wall-background">
    <div class="paper-form">
      <div class="duct-tape"></div>

      <h2 id="form-title" class="form-title">Sign Up</h2>

      <form id="auth-form" onsubmit="authManager.handleAuth(event)" class="form-stack">
        
        <div class="auth-toggle-container">
          <div id="toggle-signup" class="auth-toggle-btn active" onclick="authManager.setAuthMode('signup')">Sign Up</div>
          <div id="toggle-login" class="auth-toggle-btn" onclick="authManager.setAuthMode('login')">Log In</div>
        </div>

        <input type="text" id="nameInput" class="form-input" placeholder="Full Name" required>
        <input type="tel" id="phoneInput" class="form-input" placeholder="Phone Number" required>
        <input type="password" id="passwordInput" class="form-input" placeholder="Password" required>
        <textarea id="addressInput" class="form-input" placeholder="Delivery Address (Maharashtra)" rows="3" required></textarea>
        
        <button type="submit" id="submit-btn" class="btn btn-pink">Stick It!</button>
      </form>
    </div>
  </div>

  <nav class="bottom-navbar">
    <a href="index.html" class="nav-icon"><span class="icon">home</span></a>
    <a href="products.html" class="nav-icon"><span class="icon">storefront</span></a>
    <a href="cart.html" class="nav-icon"><span class="icon">shopping_cart</span></a>
    <a href="auth.html" id="auth-link-mobile" class="nav-icon"><span class="icon active">person</span></a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/session.js"></script>
</body>
</html>
